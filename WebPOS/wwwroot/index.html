<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebPOS</title>
    <base href="/" />
    <link href="css/mainlayout.css" rel="stylesheet" />



    <!-- Bootstrap CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />


   




    <!--<link href="_content/Syncfusion.Blazor.Themes/material.css" rel="stylesheet" />-->
    <link href="css/material.css" rel="stylesheet" />

    <!-- REQUIRED Syncfusion base styling for Menu, Sidebar, Nav components -->
    <link href="_content/Syncfusion.Blazor/styles/bootstrap.css" rel="stylesheet" />







    <!-- Custom -->
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
    <script src="_content/Syncfusion.Blazor.Core/scripts/syncfusion-blazor.min.js" type="text/javascript"></script>
</head>

<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
            <div class="text-center">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Loading WebPOS...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="d-none alert alert-danger fixed-bottom m-0 rounded-0">
        <div class="container">
            An unhandled error has occurred.
            <a href="" class="alert-link reload">Reload</a>
            <button type="button" class="btn-close dismiss float-end"></button>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    
    <script src="_content/Syncfusion.Blazor/scripts/syncfusion-blazor.min.js"></script>
    <script>
        window.toggleSidebar = () => {
            document.querySelector('.sidebar')?.classList.toggle('collapsed');
        };
    </script>
   


    <!-- Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
