<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebPOS</title>
    <base href="/" />

    <link href="css/mainlayout.css" rel="stylesheet" />

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- DevExpress Theme -->
    <link href="_content/DevExpress.Blazor.Themes/bootstrap-external.bs5.min.css" rel="stylesheet" />

    <!-- Syncfusion Theme -->
    <link href="_content/Syncfusion.Blazor.Themes/bootstrap5.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />

</head>

<body>

    <div id="app">
        <div class="d-flex justify-content-center align-items-center" style="height:100vh">
            <div class="text-center">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Loading WebPOS...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="d-none alert alert-danger fixed-bottom m-0 rounded-0">
        <div class="container">
            An unhandled error has occurred.
            <a href="" class="alert-link reload">Reload</a>
            <button type="button" class="btn-close dismiss float-end"></button>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Syncfusion Script -->
    <script src="_content/Syncfusion.Blazor/scripts/syncfusion-blazor.min.js"></script>

    <!-- DevExpress Script -->
    <script src="_content/DevExpress.Blazor/dx-blazor.js"></script>

    <script>
        window.toggleSidebar = () => {
            document.querySelector('.sidebar')?.classList.toggle('collapsed');
        };
    </script>

    <!-- Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>

</body>
</html>
